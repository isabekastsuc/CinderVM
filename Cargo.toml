[package]
name = "cindervm"
version = "0.4.2"
edition = "2021"
rust-version = "1.78"
description = "A deterministic bytecode virtual machine for agent execution, with a verifying assembler and serializable continuations"
repository = "https://github.com/ashish/cindervm"
license = "MIT"
readme = "README.md"
keywords = ["vm", "bytecode", "agents", "determinism", "continuations"]
categories = ["development-tools", "emulators"]
exclude = ["docs/assets/*", "corpus/*", ".github/*"]

[lib]
name = "cindervm"
path = "src/lib.rs"

