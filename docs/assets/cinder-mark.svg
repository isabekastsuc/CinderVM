<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 132" width="132" height="132" role="img" aria-labelledby="mark-title mark-desc">
  <title id="mark-title">cindervm</title>
  <desc id="mark-desc">A bottom-anchored operand stack of four slots feeds a dispatch arrow into a program-counter ring. A dashed line across the top marks a continuation snapshot boundary.</desc>
  <defs>
    <linearGradient id="ember" x1="0" y1="1" x2="0.35" y2="0">
      <stop offset="0" stop-color="#7a1f0f"/>
      <stop offset="0.45" stop-color="#e2521b"/>
      <stop offset="1" stop-color="#ffc061"/>
    </linearGradient>
  </defs>

  <rect x="6" y="6" width="120" height="120" rx="26" fill="#12161c"/>
  <rect x="6.5" y="6.5" width="119" height="119" rx="25.5" fill="none" stroke="#3a4250" stroke-width="1"/>

  <!-- operand stack: four slots, bottom-anchored, lower two live (ember) -->
  <g fill="none" stroke="#4a5262" stroke-width="2">
    <rect x="26" y="86" width="34" height="14" rx="3"/>
    <rect x="26" y="68" width="34" height="14" rx="3"/>
    <rect x="26" y="50" width="34" height="14" rx="3"/>
    <rect x="26" y="32" width="34" height="14" rx="3" stroke-dasharray="3 3"/>
  </g>
  <rect x="26" y="86" width="34" height="14" rx="3" fill="url(#ember)"/>
  <rect x="26" y="68" width="34" height="14" rx="3" fill="url(#ember)" opacity="0.55"/>

  <!-- dispatch arrow: stack -> pc -->
  <path d="M64 75 L84 75" stroke="#c3ccd8" stroke-width="2" stroke-linecap="round"/>
  <path d="M80 71 L85 75 L80 79" fill="none" stroke="#c3ccd8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- program counter ring, ember arc shows progress -->
  <circle cx="94" cy="75" r="13" fill="none" stroke="#4a5262" stroke-width="3"/>
  <path d="M94 62 A13 13 0 0 1 105 82" fill="none" stroke="url(#ember)" stroke-width="3" stroke-linecap="round"/>

  <!-- continuation glyph: snapshot boundary across the top -->
  <path d="M30 24 L102 24" stroke="#e2521b" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4"/>
  <circle cx="102" cy="24" r="3.5" fill="#e2521b"/>
</svg>
