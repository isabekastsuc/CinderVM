name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format check
        run: cargo fmt --check
      - name: Test
        run: cargo test
      - name: Build release
        run: cargo build --release
      - name: CLI smoke
        run: |
          ./target/release/cinderc build examples/echo.cdx -o /tmp/echo.cdxb
          ./target/release/cinderc run /tmp/echo.cdxb
          ./target/release/cinderc dis /tmp/echo.cdxb > /dev/null
